# Enhanced Capsule Metadata for Agent Routing

# Core identification
name: "{{CAPSULE_NAME}}"
slug: "{{CAPSULE_SLUG}}"
version: "0.1.0"
created: "{{CREATION_DATE}}"

# Routing configuration
routing:
  branch: "{{BRANCH}}"          # automation, web, app, backend, ops
  targets: ["{{TARGETS}}"]       # Specific technologies/platforms
  priority: "normal"             # low, normal, high, critical

# Agent preferences  
agents:
  primary: ["{{PRIMARY_AGENTS}}"]        # Main agents for this capsule
  secondary: ["{{SECONDARY_AGENTS}}"]    # Supporting agents
  exclude: []                            # Agents to avoid

# MCP configuration
mcp:
  profile: "{{MCP_PROFILE}}"     # default, webdev, automation, apple
  additional: []                  # Extra MCP servers needed
  exclude: []                     # MCP servers to exclude

# Quality gates
quality:
  dod_level: "{{DOD_LEVEL}}"     # minimal, standard, comprehensive
  test_coverage: "{{TEST_COVERAGE}}"  # 0-100
  security_scan: "{{SECURITY_SCAN}}"  # true/false
  performance_benchmark: "{{PERF_BENCH}}"  # true/false

# Context and domain
domain:
  type: "{{DOMAIN_TYPE}}"        # business, personal, experimental
  category: "{{CATEGORY}}"       # automation, web-app, mobile-app, etc.
  complexity: "{{COMPLEXITY}}"   # simple, medium, complex
  stakeholders: ["{{STAKEHOLDERS}}"]

# Integration points
integrations:
  external_apis: []
  databases: []
  cloud_services: []
  third_party_tools: []

# Deployment and lifecycle
deployment:
  targets: ["{{DEPLOY_TARGETS}}"]     # local, staging, production
  automation: "{{DEPLOY_AUTO}}"       # manual, semi, full
  rollback_strategy: "{{ROLLBACK}}"   # none, manual, auto

# Resource requirements
resources:
  estimated_hours: "{{EST_HOURS}}"
  team_size: "{{TEAM_SIZE}}"
  budget: "{{BUDGET}}"
  deadline: "{{DEADLINE}}"

# Tags for discovery and organization
tags: ["{{TAGS}}"]

# Huxley metadata
builder:
  template_version: "2.0"
  created_by_template: "capsule-base"
  routing_version: "1.0"
  mcp_version: "1.0"