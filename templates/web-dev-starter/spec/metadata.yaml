# Enhanced Capsule Metadata for Agent Routing

# Core identification
name: "{{WEB_APP_NAME}}"
slug: "{{WEB_APP_SLUG}}"
version: "0.1.0"
created: "{{CREATION_DATE}}"

# Routing configuration
routing:
  branch: "web"          # automation, web, app, backend, ops
  targets: ["react", "nextjs", "typescript", "tailwind"]       # Specific technologies/platforms
  priority: "normal"             # low, normal, high, critical

# Agent preferences  
agents:
  primary: ["frontend-specialist", "javascript-pro"]        # Main agents for this capsule
  secondary: ["backend-architect", "security-auditor"]    # Supporting agents
  exclude: []                            # Agents to avoid

# MCP configuration
mcp:
  profile: "webdev"     # default, webdev, automation, apple
  additional: []                  # Extra MCP servers needed
  exclude: []                     # MCP servers to exclude

# Quality gates
quality:
  dod_level: "comprehensive"     # minimal, standard, comprehensive
  test_coverage: "85"  # 0-100
  security_scan: "true"  # true/false
  performance_benchmark: "true"  # true/false

# Context and domain
domain:
  type: "business"        # business, personal, experimental
  category: "web-app"       # automation, web-app, mobile-app, etc.
  complexity: "medium"   # simple, medium, complex
  stakeholders: ["{{STAKEHOLDERS}}"]

# Integration points
integrations:
  external_apis: []
  databases: []
  cloud_services: []
  third_party_tools: []

# Deployment and lifecycle
deployment:
  targets: ["{{DEPLOY_TARGETS}}"]     # local, staging, production
  automation: "{{DEPLOY_AUTO}}"       # manual, semi, full
  rollback_strategy: "{{ROLLBACK}}"   # none, manual, auto

# Resource requirements
resources:
  estimated_hours: "{{EST_HOURS}}"
  team_size: "{{TEAM_SIZE}}"
  budget: "{{BUDGET}}"
  deadline: "{{DEADLINE}}"

# Tags for discovery and organization
tags: ["{{TAGS}}"]

# Huxley metadata
builder:
  template_version: "2.0"
  created_by_template: "capsule-base"
  routing_version: "1.0"
  mcp_version: "1.0"