[package]
name = "catalyst-guard"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "catalyst-guard"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["net", "io-util", "rt-multi-thread", "macros", "signal", "process", "time"] }
regex = "1"
