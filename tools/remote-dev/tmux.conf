# Catalyst Remote Dev - tmux configuration
# Optimized for Claude Code over SSH

# --- Critical for Claude Code ---
# Low escape time prevents input lag (default 500ms is too slow)
set -sg escape-time 10

# --- Terminal ---
set -g default-terminal "screen-256color"
set -ga terminal-overrides ",xterm-256color:Tc"

# --- Scrollback ---
set -g history-limit 50000

# --- Mouse ---
set -g mouse on

# --- Status bar ---
set -g status-style "bg=#1a1b26,fg=#a9b1d6"
set -g status-left "#[fg=#7aa2f7,bold] #S #[default]| "
set -g status-left-length 30
set -g status-right "#[fg=#565f89]%H:%M #[fg=#7aa2f7]#h"
set -g status-right-length 40

# --- Window/pane ---
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# --- Activity ---
set -g monitor-activity off
set -g visual-activity off

# --- Keybindings ---
# Prefix: Ctrl-a (easier than Ctrl-b over SSH)
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Easy reload
bind r source-file ~/.tmux.conf \; display "Config reloaded"

# Split panes with | and -
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Navigate panes with Alt+arrow (no prefix needed)
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D
