name: Print Poster
media_type: vector
model: local/svgwrite
auth: local
auth_provider: local

generation:
  resolution: 4K
  aspect_ratios:
    - "3:4"  # Common portrait poster ratio

refinement:
  mode: agent_in_loop  # Posters benefit from agent review
  max_iterations: 3
  quality_threshold: 0.80
  regression_cutoff: true
  evaluate_criteria:
    - visual_hierarchy
    - text_clarity
    - print_readiness
  hard_checks:
    - file_exists
    - file_not_empty
    - svg_valid_structure
    - svg_has_viewbox
    - svg_has_layers
    - svg_text_editable
    - svg_file_size

consistency:
  reference_images: 0
  style_weight: 0.0
  character_lock: false

output:
  directory: "generated-media/{date}/vectors/print/"
  naming: "{workflow}-{sequence}"
  formats:
    - svg
    - pdf
    - png

provenance:
  enabled: true
  log_eval_scores: true
  snapshot_config: true

vector:
  type: badge  # Posters use the badge generator for layout structure
  stroke_weight: 2
  corner_radius: 0
  icon_style: "filled"
  file_size_limit_kb: 500  # Posters can be larger
  export_formats:
    - svg
    - pdf
    - png
    - eps
  palette:
    primary: "#0D1B2A"
    secondary: "#1B263B"
    accent: "#E0A42B"
    foreground: "#FFFFFF"
    background: "#FFFFFF"
  # Print production settings (Phase 3)
  print:
    print_ready: true
    bleed_mm: 5.0  # 5mm bleed for larger format prints
    cmyk: true
    text_to_path: true
    color_profile: null  # Use default CMYK profile
