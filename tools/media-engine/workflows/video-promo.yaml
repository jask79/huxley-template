name: Video Promo
media_type: video
model: openai/sora-2
profile: high-fidelity

generation:
  resolution: 1080p
  aspect_ratios:
    - "16:9"
    - "9:16"
  duration: 15s
  fps: 24
  camera_motion: slow_dolly
  audio: none

refinement:
  mode: agent_in_loop
  max_iterations: 3
  quality_threshold: 0.80
  evaluate_criteria:
    - motion_consistency
    - brand_alignment
    - scene_coherence
  hard_checks:
    - file_exists
    - file_not_empty
    - not_corrupted

consistency:
  reference_images: 4
  style_weight: 0.8

output:
  directory: "generated-media/{date}/video/"
  naming: "{workflow}-{sequence}-{duration}"
  formats:
    - mp4

provenance:
  enabled: true
  log_eval_scores: true
  snapshot_config: true
