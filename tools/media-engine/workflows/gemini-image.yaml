name: Gemini Image
media_type: image
model: google/gemini-3-pro-image-preview
# Auth options (toggle here or override with --auth flag):
#   openrouter     - via paid OpenRouter account (default, most reliable)
#   gemini_direct  - direct Google API key (requires billing enabled on key)
#   gemini_oauth   - personal Google account OAuth (run: gemini-auth login first)
auth: openrouter
auth_provider: openrouter
profile: high-fidelity

generation:
  resolution: 4K
  aspect_ratios:
    - "1:1"
    - "4:3"
    - "16:9"

refinement:
  mode: autonomous
  max_iterations: 4
  quality_threshold: 0.85
  regression_cutoff: true
  evaluate_criteria:
    - lighting_consistency
    - text_legibility
    - brand_alignment
    - product_focus
  hard_checks:
    - file_exists
    - file_not_empty
    - resolution_match

consistency:
  reference_images: 0
  style_weight: 0.7
  character_lock: false

variants:
  count: 3
  variation_strength: 0.3

output:
  directory: "generated-media/{date}/"
  naming: "{workflow}-{sequence}"
  formats:
    - png

provenance:
  enabled: true
  log_eval_scores: true
  snapshot_config: true
