name: Brand Identity
media_type: image
model: google/gemini-3-pro-image-preview
profile: high-fidelity

generation:
  resolution: 4K
  aspect_ratios: ["1:1", "16:9"]

refinement:
  mode: agent_in_loop
  max_iterations: 5
  quality_threshold: 0.90
  evaluate_criteria:
    - brand_consistency
    - typography_quality
    - color_accuracy
    - visual_impact
  hard_checks:
    - file_exists
    - file_not_empty
    - resolution_match
    - not_corrupted

consistency:
  reference_images: 8
  style_weight: 0.95
  character_lock: true

output:
  directory: "generated-media/{date}/brand/"
  naming: "{workflow}-{sequence}-{resolution}"
  formats: ["png"]

provenance:
  enabled: true
  log_eval_scores: true
  snapshot_config: true
