name: Brand Color Palette
media_type: vector
model: local/svgwrite
auth: local
auth_provider: local

generation:
  resolution: 2K
  aspect_ratios:
    - "3:2"

refinement:
  mode: autonomous
  max_iterations: 1
  quality_threshold: 0.90
  regression_cutoff: true
  evaluate_criteria:
    - color_contrast
    - layout_clarity
    - label_readability
  hard_checks:
    - file_exists
    - file_not_empty
    - svg_valid_structure
    - svg_has_viewbox
    - svg_has_layers
    - svg_text_editable
    - svg_file_size

consistency:
  reference_images: 0
  style_weight: 0.0
  character_lock: false

output:
  directory: "generated-media/{date}/vectors/"
  naming: "{workflow}-{sequence}"
  formats:
    - svg
    - png

provenance:
  enabled: true
  log_eval_scores: true
  snapshot_config: true

vector:
  type: palette
  stroke_weight: 1
  corner_radius: 8
  icon_style: "filled"
  file_size_limit_kb: 200
  export_formats:
    - svg
    - png
  palette:
    primary: "#2563EB"
    secondary: "#7C3AED"
    accent: "#F59E0B"
    neutral: "#6B7280"
    foreground: "#111827"
    background: "#FFFFFF"
    success: "#10B981"
    error: "#EF4444"
