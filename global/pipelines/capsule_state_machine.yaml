# Capsule Lifecycle State Machine
# Event-driven automation for autonomous progression from ideation → deploy

version: "1.0"
created: "2025-08-15"
purpose: "Autonomous capsule lifecycle management with self-healing capabilities"

# State Definitions
states:
  ideation:
    description: "Initial concept capture and requirements gathering"
    entry_conditions:
      - capsule_created
      - spec_folder_exists
    automatic_actions:
      - generate_requirements_template
      - analyze_similar_capsules
      - suggest_quality_standards
    exit_triggers:
      - requirements_complete
      - user_approval
    timeout: "48h"
    on_timeout: notify_user

  design:
    description: "Architecture design and technical planning"
    entry_conditions:
      - requirements_validated
      - quality_standards_set
    automatic_actions:
      - select_agent_team
      - generate_architecture_doc
      - identify_dependencies
      - estimate_complexity
    exit_triggers:
      - design_approved
      - all_dependencies_resolved
    timeout: "24h"
    on_timeout: escalate_to_architect

  build:
    description: "Active development and implementation"
    entry_conditions:
      - design_complete
      - dependencies_available
      - agents_assigned
    automatic_actions:
      - setup_development_environment
      - implement_core_features
      - run_unit_tests
      - generate_documentation
    progress_tracking:
      - monitor_src_changes
      - track_test_coverage
      - measure_code_quality
    exit_triggers:
      - all_features_complete
      - tests_passing
      - quality_standards_met
    timeout: "168h"  # 1 week
    on_timeout: analyze_blockers

  validate:
    description: "Quality assurance and compliance verification"
    entry_conditions:
      - build_complete
      - code_committed
    automatic_actions:
      - context_appropriate_testing
      - security_audit
      - performance_validation
      - compliance_check
      - documentation_review
    exit_triggers:
      - validation_passed
      - exceptions_approved
    timeout: "12h"
    on_timeout: request_review

  deploy:
    description: "Production deployment and activation"
    entry_conditions:
      - validation_complete
      - deployment_approved
    automatic_actions:
      - backup_current_version
      - deploy_to_target
      - run_smoke_tests
      - update_registry
      - notify_stakeholders
    rollback_triggers:
      - deployment_failure
      - critical_error_detected
      - health_check_failed
    exit_triggers:
      - deployment_successful
      - health_checks_passing
    timeout: "2h"
    on_timeout: automatic_rollback

  monitor:
    description: "Post-deployment monitoring and optimization"
    entry_conditions:
      - deployment_complete
    automatic_actions:
      - collect_performance_metrics
      - monitor_error_rates
      - track_usage_patterns
      - identify_optimization_opportunities
    continuous: true
    alerts:
      - error_rate_spike
      - performance_degradation
      - security_incident
      - resource_exhaustion

  archived:
    description: "Capsule retired but preserved for reference"
    entry_conditions:
      - explicit_archive_command
      - 90_days_inactive
    automatic_actions:
      - create_final_snapshot
      - compress_artifacts
      - update_knowledge_base
      - extract_reusable_patterns

# Transition Rules
transitions:
  - from: ideation
    to: design
    conditions:
      - requirements.yaml exists
      - capsule.json valid
      - quality standards assigned
    actions:
      - validate_requirements
      - assign_agent_team
      - create_design_brief

  - from: design
    to: build
    conditions:
      - architecture approved
      - dependencies resolved
      - resources available
    actions:
      - setup_build_environment
      - initialize_version_control
      - start_progress_tracking

  - from: build
    to: validate
    conditions:
      - source code complete
      - unit tests passing
      - documentation exists
    actions:
      - freeze_code_version
      - trigger_validation_suite
      - generate_test_report

  - from: validate
    to: deploy
    conditions:
      - all validations passed
      - deployment approved
      - target environment ready
    actions:
      - create_deployment_package
      - backup_current_state
      - execute_deployment

  - from: deploy
    to: monitor
    conditions:
      - deployment successful
      - health checks passing
      - monitoring configured
    actions:
      - activate_monitoring
      - establish_baselines
      - configure_alerts

  # Rollback transitions
  - from: deploy
    to: build
    conditions:
      - deployment failed
      - critical issues found
    actions:
      - rollback_deployment
      - analyze_failure
      - create_fix_requirements

  - from: validate
    to: build
    conditions:
      - validation failed
      - quality gates not met
    actions:
      - identify_issues
      - assign_fix_tasks
      - update_test_cases

# Event Handlers
events:
  capsule_created:
    triggers:
      - state: ideation
      - action: initialize_capsule_structure
      - notification: team_notification

  requirements_updated:
    triggers:
      - validation: check_completeness
      - action: update_complexity_estimate
      - transition: evaluate_state_change

  code_committed:
    triggers:
      - action: run_pre_commit_hooks
      - validation: security_scan
      - metrics: update_progress

  test_failure:
    triggers:
      - action: analyze_failure_pattern
      - notification: developer_alert
      - suggestion: similar_fix_patterns

  deployment_health_check:
    interval: "5m"
    triggers:
      - validation: check_health_endpoints
      - metrics: collect_performance_data
      - alert: on_degradation

# Automation Hooks
hooks:
  pre_transition:
    - validate_prerequisites
    - check_resource_availability
    - backup_current_state

  post_transition:
    - update_registry
    - log_transition_event
    - notify_stakeholders

  on_error:
    - capture_error_context
    - attempt_self_healing
    - escalate_if_needed

  on_success:
    - extract_patterns
    - update_knowledge_base
    - optimize_future_builds

# Self-Healing Mechanisms
self_healing:
  dependency_resolution:
    - detect_missing_dependencies
    - search_package_registries
    - auto_install_compatible_versions
    - verify_compatibility

  test_failure_recovery:
    - analyze_failure_patterns
    - search_similar_fixes
    - apply_suggested_patches
    - re_run_affected_tests

  performance_optimization:
    - identify_bottlenecks
    - apply_optimization_patterns
    - measure_improvement
    - rollback_if_degraded

  resource_management:
    - monitor_resource_usage
    - scale_resources_as_needed
    - cleanup_unused_resources
    - optimize_allocation

# Intelligence Features
intelligence:
  pattern_recognition:
    - analyze_successful_builds
    - identify_common_patterns
    - generate_templates
    - suggest_optimizations

  predictive_analytics:
    - estimate_completion_time
    - predict_failure_risks
    - recommend_preventive_actions
    - optimize_resource_allocation

  learning_engine:
    - track_decision_outcomes
    - update_success_patterns
    - refine_agent_selection
    - improve_estimates

  knowledge_accumulation:
    - capture_build_insights
    - document_solutions
    - index_reusable_components
    - build_recommendation_engine

# Integration Points
integrations:
  version_control:
    - git_hooks
    - branch_protection
    - automated_commits
    - pr_generation

  ci_cd:
    - github_actions
    - jenkins_pipelines
    - custom_workflows
    - deployment_scripts

  monitoring:
    - datadog_metrics
    - custom_dashboards
    - alert_routing
    - incident_management

  knowledge_base:
    - mcp_memory
    - decision_journal
    - pattern_library
    - solution_database

# Configuration
config:
  default_quality: standard
  max_parallel_builds: 3
  auto_rollback: true
  learning_enabled: true
  pattern_extraction: true
  self_healing: true
  
  timeouts:
    ideation: 48h
    design: 24h
    build: 168h
    validate: 12h
    deploy: 2h
    
  thresholds:
    test_coverage_minimum: 80
    performance_degradation: 20
    error_rate_maximum: 1
    health_check_interval: 300