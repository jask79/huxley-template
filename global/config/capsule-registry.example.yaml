# Capsule Registry - Single source of truth for all Huxley capsules
# Used by: /capsules command, navigation intelligence, capsule tooling
#
# Copy this file to capsule-registry.yaml and add your capsules:
#   cp capsule-registry.example.yaml capsule-registry.yaml
#
# Each entry needs:
#   name: Human-readable name
#   emoji: Icon for display
#   description: What the capsule does
#   shortcut: /slash-command (or null)
#   status: active | planning | dormant

# Start empty: /capsules stays quiet until you register your first capsule.
capsules: {}

# Example entries (uncomment and adapt):
#
#   my-project:
#     name: My Project
#     emoji: 🚀
#     description: A sample capsule to demonstrate the registry format
#     shortcut: null
#     status: active
#
#   my-saas:
#     name: My SaaS
#     emoji: 💼
#     description: SaaS product with auth, billing, and dashboard
#     shortcut: /saas
#     status: active
