# Huxley Tool Registry
# Canonical list of operational tools. Used by `tools/list-tools.py` and `/tools` command.
# Only includes tools that are actively used — not legacy/one-off scripts.
#
# Format per tool:
#   name: Display name
#   emoji: Icon
#   path: Relative path from Huxley root
#   skill: Slash-command skill name (if any)
#   agents: Comma-separated agent names that use this tool
#   status: active | dormant

tools:

  media:
    media-engine:
      name: Media Engine
      emoji: 🎬
      path: tools/media-engine/cli.py
      skill: media-engine
      agents: Graphic Designer, Camera Man
      status: active

    nano-banana:
      name: Nano Banana (Gemini + Veo 3.1)
      emoji: 🍌
      path: /opt/homebrew/bin/nano-banana
      skill: nano-banana
      agents: Camera Man, Graphic Designer
      status: active

    color-grader:
      name: Color Grader
      emoji: 🎨
      path: tools/color_grader.py
      skill: color-grading
      agents: Studio Engineer
      status: active

    obs-cli:
      name: OBS Studio CLI
      emoji: 🔴
